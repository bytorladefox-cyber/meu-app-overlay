<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay App</title>
    <style>
        /* Zera tudo para garantir que não haja margens ou cores padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Força a transparência no nível mais alto do documento */
        html, body {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0) !important;
            background: transparent !important;
            overflow: hidden;
        }
