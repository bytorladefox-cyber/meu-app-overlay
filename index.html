<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Força a transparência total no app */
        html, body {
            background: transparent !important;
            background-color: rgba(0,0,0,0) !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* O Iframe vai carregar seu menu da Lovable */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <iframe src="COLOQUE_AQUI_O_SEU_LINK_DA_LOVABLE" id="menuIframe"></iframe>

    <script>
        // Tenta remover o fundo branco do conteúdo que vem da Lovable
        const iframe = document.getElementById('menuIframe');
        iframe.onload = function() {
            try {
                iframe.contentWindow.document.body.style.backgroundColor = "transparent";
            } catch (e) {
                console.log("Proteção de segurança impediu limpar o fundo, mas o container já é transparente.");
            }
        };
    </script>
</body>
</html>
