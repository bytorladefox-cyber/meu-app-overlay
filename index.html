<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Menu Overlay</title>
    <style>
        /* A MÁGICA ESTÁ AQUI: Fundo 100% invisível */
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden; /* Evita barras de rolagem */
        }

        /* O MENU: Ele precisa ter cor, senão você não o vê */
        .menu {
            background: #222222; /* Cor sólida do painel */
            color: white;
            padding: 25px;
            border-radius: 20px;
            border: 3px solid #00ff00;
            box-shadow: 0px 0px 15px rgba(0, 255, 0, 0.5);
            text-align: center;
            width: 80%; /* Ajuste o tamanho conforme necessário */
            max-width: 300px;
            pointer-events: auto; /* Garante que o clique funcione no menu */
        }

        button {
            background-color: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <h3>Painel Ativo</h3>
        <p>O fundo ao redor deve estar invisível agora.</p>
        <button onclick="alert('Sistema funcionando!')">Testar Menu</button>
    </div>

</body>
</html>
