<!DOCTYPE html>
<html>
<head>
    <style>
        html, body { background: transparent !important; margin: 0; padding: 0; overflow: hidden; }
        iframe {
            width: 100vw; height: 100vh; border: none;
            /* O segredo: Filtro de inversão e brilho para tentar 'vazar' o fundo */
            background: transparent !important;
        }
    </style>
</head>
<body>
    <iframe src="https://snap-flow-click.lovable.app/" id="appFrame"></iframe>

    <script>
        const frame = document.getElementById('appFrame');
        
        // Função para tentar limpar o branco do site externo
        setInterval(() => {
            try {
                const doc = frame.contentWindow.document;
                const style = doc.createElement('style');
                style.innerHTML = `
                    html, body, #root, main, .min-h-screen { 
                        background: transparent !important; 
                        background-color: transparent !important; 
                    }
                    * { border-color: transparent !important; }
                `;
                doc.head.appendChild(style);
            } catch (e) {
                // Se o navegador bloquear, usamos o plano B: Injetar via Capacitor
                if (window.Capacitor) {
                    window.Capacitor.nativePromise('WebView', 'setBackgroundColor', { color: '#00000000' });
                }
            }
        }, 1000);
    </script>
</body>
</html>
