<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            background: transparent !important;
            background-color: rgba(0,0,0,0) !important;
            margin: 0; padding: 0;
            overflow: hidden;
        }
        /* Vamos deixar o container do menu pequeno */
        .floating-container {
            width: 80px; /* Tamanho do seu botão apenas */
            height: 80px;
            background: transparent;
        }
        iframe {
            width: 100%; height: 100%;
            border: none;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div class="floating-container">
        <iframe src="SEU_LINK_DA_LOVABLE_AQUI"></iframe>
    </div>
</body>
</html>
