name: Build
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          npm install @capacitor/cli @capacitor/android
          mkdir -p www
          echo '<!DOCTYPE html><html><head><style>body { background: transparent !important; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }</style></head><body><div style="background: rgba(0,255,0,0.8); padding: 20px; border-radius: 10px; border: 2px solid white;">MENU ATIVO</div></body></html>' > www/index.html
          rm -rf android
          npx cap add android
          
          # 1. Garante que a pasta do código Java exista (Isso resolve o erro do seu print)
          mkdir -p android/app/src/main/java/com/getcapacitor/community/example/
          
          # 2. Configura o Namespace e o Kotlin
          echo "android { namespace 'com.getcapacitor.community.example' }" >> android/app/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

          # 3. Cria o arquivo Java no lugar certo (O "Cérebro" do App)
          cat <<EOF > android/app/src/main/java/com/getcapacitor/community/example/MainActivity.java
          package com.getcapacitor.community.example;
          import android.os.Bundle;
          import android.graphics.Color;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      this.bridge.getWebView().setBackgroundColor(Color.TRANSPARENT);
                      getWindow().getDecorView().setBackgroundColor(Color.TRANSPARENT);
                  } catch (Exception e) {}
              }
          }
          EOF

          # 4. Força o Manifesto com permissões de sobreposição
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:label="Menu Overlay">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
