name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Config App
        run: |
          npm install @capacitor/cli @capacitor/android
          mkdir -p www
          echo '<html></html>' > www/index.html
          echo '{ "appId": "com.getcapacitor.community.example", "appName": "Menu Overlay", "webDir": "www", "server": { "url": "https://snap-flow-click.lovable.app/", "cleartext": true } }' > capacitor.config.json
          
          # A LINHA ABAIXO É A QUE RESOLVE O SEU ERRO (LIMPA TUDO ANTES)
          rm -rf android
          
          npx cap add android
          mkdir -p android/app/src/main/java/com/getcapacitor/community/example/
          echo "android { namespace 'com.getcapacitor.community.example' }" >> android/app/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Native Transparency Fix
        run: |
          cat <<EOF > android/app/src/main/java/com/getcapacitor/community/example/MainActivity.java
          package com.getcapacitor.community.example;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().setBackgroundColor(Color.TRANSPARENT);
                  this.bridge.getWebView().setLayerType(View.LAYER
                  
