name: Build
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          npm install @capacitor/cli @capacitor/android
          mkdir -p www
          echo "<html><body>Overlay</body></html>" > www/index.html
          rm -rf android
          npx cap add android
          
          # COMANDO ESPECIAL: Remove as duplicatas do Kotlin e define o Namespace
          echo "android { namespace 'com.getcapacitor.community.example' }" >> android/app/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/app/build.gradle
          
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
