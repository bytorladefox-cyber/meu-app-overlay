name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          # Cria um arquivo falso só para o capacitor não reclamar
          touch www/index.html 

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          
      - name: Copy Custom AndroidManifest
        run: |
          # Isso garante que o arquivo que você criou vá para o lugar certo
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.backup
          # O passo acima é só segurança. O robô vai usar as configurações que você fez.

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
