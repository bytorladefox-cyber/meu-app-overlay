      - name: Native Fixes
        run: |
          cat <<EOF > android/app/src/main/java/com/getcapacitor/community/example/MainActivity.java
          package com.getcapacitor.community.example;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  
                  // Deixa a estrutura nativa transparente
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                  getWindow().getDecorView().setBackgroundColor(Color.TRANSPARENT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          // Esse script embaixo é um 'veneno' contra fundo branco
                          // Ele procura em todos os cantos do site e força transparência
                          String js = "var style = document.createElement('style');" +
                                     "style.innerHTML = '* { background-color: transparent !important; } " +
                                     ".bg-white, .bg-background, [data-background] { background-color: transparent !important; }';" +
                                     "document.head.appendChild(style);" +
                                     "document.body.style.background = 'transparent';";
                          view.evaluateJavascript(js, null);
                      }
                  });
              }
          }
          EOF
          
